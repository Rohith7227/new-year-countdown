<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>New Year's Eve Countdown</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#020024,#090979,#000);
overflow:hidden;
color:white;
}

body::before{
content:"";
position:absolute;
width:200%;
height:200%;
background:radial-gradient(circle,#ffffff88 1px,transparent 1px);
background-size:40px 40px;
animation:stars 80s linear infinite;
opacity:.35;
}

@keyframes stars{
from{transform:translateY(0);}
to{transform:translateY(-500px);}
}

.container{
position:relative;
text-align:center;
z-index:1;
padding:20px;
}

h1{
font-size:clamp(2rem,5vw,4rem);
margin-bottom:25px;
letter-spacing:2px;
}

.countdown{
display:grid;
grid-template-columns:repeat(4,minmax(80px,150px));
gap:18px;
justify-content:center;
}

.box{
background:rgba(255,255,255,.08);
backdrop-filter:blur(12px);
border:1px solid rgba(255,255,255,.15);
border-radius:18px;
padding:20px;
box-shadow:0 0 25px rgba(255,255,255,.12);
}

.number{
font-size:clamp(2.5rem,6vw,5rem);
font-weight:bold;
color:#ffd700;
text-shadow:0 0 12px #ffd700,0 0 28px #ff8c00;
}

.label{
margin-top:8px;
font-size:.9rem;
letter-spacing:1px;
opacity:.9;
text-transform:uppercase;
}

.message{
display:none;
font-size:clamp(2.5rem,8vw,5rem);
font-weight:bold;
color:#ffd700;
text-shadow:0 0 20px #fff,0 0 50px #ffd700;
animation:pop 1.2s infinite alternate;
}

@keyframes pop{
from{transform:scale(1);}
to{transform:scale(1.08);}
}

@media(max-width:600px){
.countdown{
grid-template-columns:repeat(2,1fr);
}
}
</style>
</head>

<body>

<div class="container">
<h1>🎆 Countdown to New Year 🎆</h1>

<div id="countdown" class="countdown">
<div class="box">
<div id="days" class="number">0</div>
<div class="label">Days</div>
</div>

<div class="box">
<div id="hours" class="number">00</div>
<div class="label">Hours</div>
</div>

<div class="box">
<div id="minutes" class="number">00</div>
<div class="label">Minutes</div>
</div>

<div class="box">
<div id="seconds" class="number">00</div>
<div class="label">Seconds</div>
</div>
</div>

<div id="message" class="message">🎉 Happy New Year! 🎉</div>
</div>

<script>
// Automatically target next New Year
const now = new Date();
const nextYear = now.getFullYear() + 1;
const target = new Date(`January 1, ${nextYear} 00:00:00`).getTime();

function updateCountdown(){

const current = Date.now();
const distance = target - current;

if(distance <= 0){
document.getElementById("countdown").style.display = "none";
document.getElementById("message").style.display = "block";
clearInterval(timer);
return;
}

const days = Math.floor(distance/(1000*60*60*24));
const hours = Math.floor((distance%(1000*60*60*24))/(1000*60*60));
const minutes = Math.floor((distance%(1000*60*60))/(1000*60));
const seconds = Math.floor((distance%(1000*60))/1000);

document.getElementById("days").textContent = days;
document.getElementById("hours").textContent = String(hours).padStart(2,"0");
document.getElementById("minutes").textContent = String(minutes).padStart(2,"0");
document.getElementById("seconds").textContent = String(seconds).padStart(2,"0");
}

updateCountdown();
const timer = setInterval(updateCountdown,1000);
</script>

</body>
</html>
